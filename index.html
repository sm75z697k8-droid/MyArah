<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f6f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="MyArah — discover Malaysia, beautifully.">
  <title>MyArah — Explore Malaysia</title>
  <link rel="preconnect" href="https://basemaps.cartocdn.com">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.16.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main class="app" aria-label="MyArah map">
    <div id="map" aria-label="Interactive map of Malaysia"></div>
    <header class="topbar">
      <button class="search-trigger surface" id="openSearch" aria-label="Search places">
        <span class="search-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="10.9" cy="10.9" r="6.5"/><path d="m16 16 4.3 4.3"/></svg></span>
        <span class="search-placeholder">Search Malaysia</span>
        <span class="search-shortcut" aria-hidden="true">⌕</span>
      </button>
      <button class="avatar surface" id="theme" aria-label="Switch to dark map" title="Change appearance"><svg viewBox="0 0 24 24"><path d="M20 15.7A8 8 0 0 1 8.3 4 8 8 0 1 0 20 15.7Z"/></svg></button>
    </header>
    <div class="map-controls">
      <button id="locate" class="control surface primary-control" aria-label="Show my location" title="My location"><svg viewBox="0 0 24 24"><path d="m12 3-7.5 17L12 16l7.5 4L12 3Z"/></svg></button>
      <button id="tilt" class="control surface text-control" aria-label="Switch to 3D map" aria-pressed="false" title="2D / 3D map">3D</button>
      <button id="north" class="control surface" aria-label="Point map north" title="Reset compass"><svg viewBox="0 0 24 24"><path d="m12 3 5 18-5-4-5 4 5-18Z"/></svg></button>
    </div>
    <section id="bottomSheet" class="sheet surface" data-sheet-state="peek" aria-label="Explore destinations">
      <div id="sheetDragArea" class="sheet-drag-area">
        <button id="sheetGrabber" class="sheet-grabber" type="button" aria-label="Expand destinations panel" aria-expanded="false" aria-controls="sheetScroll">
          <span class="handle" aria-hidden="true"></span>
        </button>
        <div class="sheet-head"><div><span class="eyebrow">YOUR MAP, YOUR WAY</span><h1>Where to?</h1></div><span class="brand">My<span>Arah</span><span class="brand-dot">.</span></span></div>
      </div>
      <div id="sheetScroll" class="sheet-scroll" tabindex="0" aria-label="Destination options">
        <button id="browse" class="destination-button"><span class="dest-circle"><svg viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12Z"/><circle cx="12" cy="9" r="2.4"/></svg></span><span class="dest-content"><strong>Find a destination</strong><small>Search cities across Malaysia</small></span><span class="chevron">›</span></button>
        <div id="sheetExtras" class="sheet-extras" inert aria-hidden="true">
          <div class="section-caption">EXPLORE MALAYSIA</div>
          <div class="chips" aria-label="Popular places">
            <button data-place="kl">Kuala Lumpur</button><button data-place="penang">George Town</button><button data-place="jb">Johor Bahru</button><button data-place="kk">Kota Kinabalu</button><button data-place="kuching">Kuching</button>
          </div>
          <div class="sheet-footer"><div class="status-dot"></div><span id="placeSubtitle">Map ready · Malaysia</span><button id="recenter" aria-label="Show selected city">View <span aria-hidden="true">↗</span></button></div>
        </div>
      </div>
    </section>
    <div class="toast" id="notice" role="status" aria-live="polite" hidden></div>
    <div class="modal-backdrop" id="overlay" aria-hidden="true">
      <section class="search-modal" role="dialog" aria-modal="true" aria-label="Search destinations">
        <div class="modal-header"><div class="modal-title">Search places</div><button class="close" id="closeSearch" aria-label="Close search">Done</button></div>
        <label class="search-field"><svg viewBox="0 0 24 24"><circle cx="10.9" cy="10.9" r="6.5"/><path d="m16 16 4.3 4.3"/></svg><input id="searchInput" type="search" placeholder="City or state" autocomplete="off" spellcheck="false"></label>
        <div class="modal-label">SUGGESTED DESTINATIONS</div><div id="results" class="results"></div>
        <p class="modal-footnote">This preview searches five sample cities. Address search and real routes are coming later.</p>
      </section>
    </div>
  </main>
</body>
</html>
