<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="MyArah — explore Malaysia on a clean, interactive map.">
  <meta name="theme-color" content="#F3F0E8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MyArah">
  <title>MyArah — Malaysia Map</title>
  <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.16.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="./src/styles/tokens.css">
  <link rel="stylesheet" href="./src/styles/base.css">
  <link rel="stylesheet" href="./src/styles/map.css">
  <link rel="stylesheet" href="./src/styles/location.css">
  <link rel="stylesheet" href="./src/styles/bubbles.css">
  <script type="module" src="./src/main.js"></script>
</head>
<body>
  <main class="map-app" aria-label="MyArah map of Malaysia">
    <div id="map" class="map-canvas" role="region" aria-label="Interactive map of Malaysia. Drag to pan and pinch to zoom."></div>
    <button id="theme-toggle" class="glass-control theme-toggle" type="button" aria-label="Switch to dark map" aria-pressed="false" title="Switch to dark map">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20.8 15.2A8.8 8.8 0 0 1 8.8 3.2 8.8 8.8 0 1 0 20.8 15.2Z"/>
      </svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42-1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/>
      </svg>
    </button>
    <button id="locate-button" class="glass-control location-control" type="button" aria-label="Find my current location" title="Find my current location" disabled>
      <svg class="location-arrow" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M19.8 3.5 3.7 10.6a.85.85 0 0 0 .1 1.6l6.3 2.1 2.2 6.2a.85.85 0 0 0 1.6.03L20.9 4.6a.85.85 0 0 0-1.1-1.1Z" fill="currentColor"/>
      </svg>
      <span class="location-spinner" aria-hidden="true"></span>
    </button>
    <div id="map-status" class="map-status" role="status" aria-live="polite">Loading map…</div>
    <div id="location-status" class="location-status" role="status" aria-live="polite" hidden></div>
  </main>
</body>
</html>
