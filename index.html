<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f9fb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>MyArah — Maps</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.14.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/maplibre-gl@5.14.0/dist/maplibre-gl.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app">
    <div id="map" aria-label="Interactive map of Malaysia"></div>
    <div class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">↗</span><span>MyArah</span><span class="version">BETA</span></div>
      <button class="search-button" id="searchOpen" type="button" aria-label="Choose a location"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg><span>Where to?</span><span class="search-shortcut">Search</span></button>
    </div>
    <div class="controls" aria-label="Map controls">
      <div class="control-group"><button class="icon-button" id="locate" title="My location" aria-label="My location"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="2"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/></svg></button><button class="icon-button" id="north" title="Face north" aria-label="Face north"><svg viewBox="0 0 24 24"><path d="m12 3 6 18-6-4-6 4z"/></svg></button></div>
      <div class="control-group"><button class="icon-button" id="zoomIn" aria-label="Zoom in">+</button><button class="icon-button" id="zoomOut" aria-label="Zoom out">−</button></div>
    </div>
    <section class="bottom-sheet" aria-label="Map options">
      <div class="grabber" aria-hidden="true"></div>
      <div class="heading-row"><div><span class="eyebrow">EXPLORE MALAYSIA</span><h1>Discover your way.</h1></div><div class="status"><span class="status-dot"></span> Map preview</div></div>
      <div class="segmented" role="group" aria-label="Map perspective"><button id="mode2d" class="active" type="button" aria-pressed="true">2D</button><button id="mode3d" type="button" aria-pressed="false">3D</button></div>
      <div class="sheet-bottom"><span id="modeHelp">Classic top-down view</span><button id="themeToggle" type="button" class="theme-button" aria-label="Toggle light or dark map"><svg viewBox="0 0 24 24"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2z"/></svg><span>Dark map</span></button></div>
    </section>
    <div class="search-overlay" id="searchOverlay" hidden><section class="search-panel" role="dialog" aria-modal="true" aria-label="Choose a place"><div class="search-panel-header"><strong>Explore Malaysia</strong><button id="searchClose" class="close-button" aria-label="Close search">Done</button></div><label for="placeSearch">Search sample cities</label><input id="placeSearch" type="search" placeholder="City or state" autocomplete="off"><div id="results" class="results"></div><p class="search-note">City shortcuts only — address and business search is coming later.</p></section></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </main>
</body>
</html>
